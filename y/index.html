<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/x-icon" href="Imagenes/circle-user-solid.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS Project</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />

  <style>
    body {
        background-color: #EEEEEE; 
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .modal-content {
        background-color: #222831 !important; 
        color: #EEEEEE;
        border: none;
    }

    .modal-header,
    .modal-footer {
        background-color: #393E46 !important;
        border: none;
    }

    label {
        color: #EEEEEE;
    }

    .form-control {
        background-color: #EEEEEE;
        color: #222831;
        border: none;
    }

    .form-control:focus {
        border: 2px solid #00ADB5;
        box-shadow: none;
    }

    .btn-primary {
        background-color: #00ADB5;
        border: none;
        color: white;
    } 


    .btn-primary:hover {
        background-color: #019aa0;
    }
    .btn-secondary {
        background-color: #393E46;
        border: none;
        color: #EEEEEE;
    }
    .btn-secondary:hover {
        background-color: #2c3036;
    }
</style>
</head>
<body>
  <div class="modal fade" id="iniciomodal" aria-hidden="true" aria-labelledby="iniciomodalLabel" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="iniciomodalLabel">Iniciar sesión</h1>
        </div>
        <div class="modal-body">
          <form id="sesionform">
            <label for="email">Correo</label>
            <input type="email" id="email" class="form-control mb-3" placeholder="Ingrese su correo" />
            <label for="password">Contraseña</label>
            <input type="password" id="password" class="form-control mb-3" placeholder="**************" />
            <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
            <button style="justify-content: center; margin-top: 5px;" type="button" id="olvidar" class="btn btn-secondary w-100" > Olvidaste tu contraseña?</button>
          </form>
          <button style="justify-content: center; margin-top: 5px;" type="button" id="googlelog" class="btn btn-secondary w-100" > Ingresa con google</button>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#registmodal">No tienes cuenta? Registrate</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="registmodal" aria-hidden="true" aria-labelledby="registmodalLabel" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="registmodalLabel">Registrate</h1>
        </div>
        <div class="modal-body">
          <form id="regisform">
            <label for="idnombre">Nombre</label>
            <input type="text" id="idnombre" class="form-control" placeholder="Ingrese su Nombre" />
            <label for="correoR">Correo</label>
            <input type="email" id="correoR" class="form-control" placeholder="Ingrese su correo" />
            <label for="contraseñaR">Contraseña</label>
            <input type="password" id="contraseñaR" class="form-control" placeholder="**************" />
            <label for="confirmcontraseña">Confirma tu contraseña</label>
            <input type="password" id="confirmcontraseña" class="form-control" placeholder="**************" />
            <button type="submit" class="btn btn-primary w-100 mt-3">Registrate</button>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#iniciomodal">Ya tienes cuenta? Inicia sesión</button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal fade border-0" id="exitoModal" tabindex="-1" aria-labelledby="exitoModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-success text-white">
        <div class="modal-header border-0">
          <h4 class="modal-title" id="exitoModalLabel">Has iniciado sesión</h4>
        </div>
        <div class="modal-body">
          Se ha iniciado sesión correctamente.
        </div>
        <div class="modal-footer border-0" style="justify-content: center;">
          <button type="button" id="btnAceptarExito" class="btn btn-light">Aceptar</button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal fade" id="singupm" tabindex="-1" aria-labelledby="singupmLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-success text-white">
        <div class="modal-header border-0" style="justify-content:center;">
          <h4 class="modal-title" id="singupmLabel">Registro Completo</h4>
        </div>
        <div class="modal-body">
          Bienvenido, por favor inicia sesión para continuar.
        </div>
        <div class="modal-footer border-0" style="justify-content:center;">
          <button type="button" id="aceptar" class="btn btn-light">Aceptar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <script type="module" src="app/sesion.js"></script>
  <script type="module" src="app/registros.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const modalInicioEl = document.getElementById('iniciomodal');
      const modalRegistroEl = document.getElementById('registmodal');
      const modalInicio = new bootstrap.Modal(modalInicioEl, { backdrop: 'static', keyboard: false });
      const modalRegistro = new bootstrap.Modal(modalRegistroEl, { backdrop: 'static', keyboard: false });

      modalInicio.show();

      function abrirRegistro() {
        modalRegistro.show();
        modalInicioEl.removeEventListener('hidden.bs.modal', abrirRegistro);
      }

      function abrirInicio() {
        modalInicio.show();
        modalRegistroEl.removeEventListener('hidden.bs.modal', abrirInicio);
      }

      modalInicioEl.querySelector('[data-bs-target="#registmodal"]').addEventListener('click', function () {
        modalInicio.hide();
        modalInicioEl.addEventListener('hidden.bs.modal', abrirRegistro);
      });

      modalRegistroEl.querySelector('[data-bs-target="#iniciomodal"]').addEventListener('click', function () {
        modalRegistro.hide();
        modalRegistroEl.addEventListener('hidden.bs.modal', abrirInicio);
      });
    });
  </script>

</body>

</html>
